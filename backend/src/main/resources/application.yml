server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/smart_finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      continue-on-error: false
      encoding: UTF-8
  flyway:
    enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  expiration: 86400000

# LangChain4j - DashScope (通义千问)
langchain4j:
  dashscope:
    chat-model:
      model-name: qwen3.6-flash
      enable-thinking: ${DASHSCOPE_CHAT_ENABLE_THINKING:false}
      base-url: ${DASHSCOPE_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      timeout: ${DASHSCOPE_CHAT_TIMEOUT:120s}
      temperature: 0.4
      top-p: 0.9
    embedding-model:
      model-name: text-embedding-v4

# 联网搜索配置
search:
  api-key: ${TAVILY_API_KEY:}

bill:
  confirmation-guard:
    enabled: ${BILL_CONFIRMATION_GUARD_ENABLED:true}
    lease-ttl: ${BILL_CONFIRMATION_GUARD_LEASE_TTL:30s}
    failure-backoff: ${BILL_CONFIRMATION_GUARD_FAILURE_BACKOFF:30s}
  upload-dir: ${BILL_UPLOAD_DIR:uploads/bills}
  ai:
    endpoint: ${DASHSCOPE_VL_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    multimodal-model: ${DASHSCOPE_VL_MODEL:qwen3.5-omni-plus-2026-03-15}

agent:
  memory:
    queue-capacity: ${AGENT_MEMORY_QUEUE_CAPACITY:64}
  context:
    max-tokens: ${AGENT_CONTEXT_MAX_TOKENS:12000}
    reserved-output-tokens: ${AGENT_CONTEXT_RESERVED_OUTPUT_TOKENS:1500}
    auto-compress-threshold: ${AGENT_CONTEXT_AUTO_COMPRESS_THRESHOLD:0.75}
    summary-model: ${AGENT_CONTEXT_SUMMARY_MODEL:}
    summary-trigger-tokens: ${AGENT_CONTEXT_SUMMARY_TRIGGER_TOKENS:4000}
    summary-keep-messages: ${AGENT_CONTEXT_SUMMARY_KEEP_MESSAGES:20}

analysis-service:
  base-url: ${ANALYSIS_SERVICE_URL:http://127.0.0.1:8090}
  internal-token: ${ANALYSIS_INTERNAL_TOKEN:dev-analysis-token}
  benchmark-connect-timeout: ${ANALYSIS_BENCHMARK_CONNECT_TIMEOUT:10s}
  benchmark-read-timeout: ${ANALYSIS_BENCHMARK_READ_TIMEOUT:90s}
  catalog-read-timeout: ${ANALYSIS_CATALOG_READ_TIMEOUT:120s}

market-data:
  full-library:
    enabled: ${MARKET_DATA_FULL_LIBRARY_ENABLED:false}
    markets: ${MARKET_DATA_FULL_LIBRARY_MARKETS:CN_A,CN_ETF,US,INDEX,FUND_CN}
    datasets: ${MARKET_DATA_FULL_LIBRARY_DATASETS:PRICE,PROFILE,FINANCIALS,CORPORATE_ACTIONS,FUND_HOLDINGS,FUND_OPERATIONS,VALUATION,SHAREHOLDERS,FUND_NOTICES}
  demand:
    a-share-calendar-fund-categories: ${MARKET_DATA_A_SHARE_CALENDAR_FUND_CATEGORIES:INDEX_FUND,ACTIVE_EQUITY_FUND,HYBRID_FUND,BOND_FUND}
    detail-ttl: ${MARKET_DATA_DETAIL_TTL:30m}
    reconcile-ms: ${MARKET_DATA_DEMAND_RECONCILE_MS:60000}
    preparation-check-ms: ${MARKET_DATA_PREPARATION_CHECK_MS:15000}
    preparation-timeout: ${MARKET_DATA_PREPARATION_TIMEOUT:24h}
  sync:
    enabled: ${MARKET_DATA_SYNC_ENABLED:true}
  history-years: ${MARKET_DATA_HISTORY_YEARS:50}
  bootstrap:
    initial-delay-ms: ${MARKET_DATA_BOOTSTRAP_INITIAL_DELAY_MS:10000}
    interval-ms: ${MARKET_DATA_BOOTSTRAP_INTERVAL_MS:21600000}
  catalog:
    cron: ${MARKET_DATA_CATALOG_CRON:0 15 9 * * *}
  worker:
    foreground-quota: ${MARKET_DATA_FOREGROUND_QUOTA:8}
    initial-delay-ms: ${MARKET_DATA_WORKER_INITIAL_DELAY_MS:15000}
    poll-ms: ${MARKET_DATA_WORKER_POLL_MS:2000}
    chunk-days: ${MARKET_DATA_WORKER_CHUNK_DAYS:3650}
    lease-seconds: ${MARKET_DATA_WORKER_LEASE_SECONDS:600}
    max-attempts: ${MARKET_DATA_WORKER_MAX_ATTEMPTS:6}
    concurrency: ${MARKET_DATA_WORKER_CONCURRENCY:2}
    failed-retry-hours: ${MARKET_DATA_FAILED_RETRY_HOURS:6}
  research:
    refresh-overlap-years: ${MARKET_DATA_RESEARCH_REFRESH_OVERLAP_YEARS:2}
  daily:
    cn-cron: ${MARKET_DATA_DAILY_CN_CRON:0 30 17 * * MON-FRI}
    us-cron: ${MARKET_DATA_DAILY_US_CRON:0 30 8 * * TUE-SAT}
    fund-cron: ${MARKET_DATA_DAILY_FUND_CRON:0 0 22 * * MON-FRI}

quant:
  workbench:
    snapshot:
      max-uncompressed-bytes: ${QUANT_SNAPSHOT_MAX_UNCOMPRESSED_BYTES:134217728}
      max-compressed-bytes: ${QUANT_SNAPSHOT_MAX_COMPRESSED_BYTES:33554432}

api:
  rate-limit:
    enabled: ${API_RATE_LIMIT_ENABLED:true}
    failure-backoff: ${API_RATE_LIMIT_FAILURE_BACKOFF:30s}
    local-max-entries: ${API_RATE_LIMIT_LOCAL_MAX_ENTRIES:10000}
    login:
      limit: ${API_RATE_LIMIT_LOGIN_LIMIT:20}
      window: ${API_RATE_LIMIT_LOGIN_WINDOW:60s}
    chat:
      limit: ${API_RATE_LIMIT_CHAT_LIMIT:10}
      window: ${API_RATE_LIMIT_CHAT_WINDOW:60s}
    quote-refresh:
      limit: ${API_RATE_LIMIT_QUOTE_REFRESH_LIMIT:6}
      window: ${API_RATE_LIMIT_QUOTE_REFRESH_WINDOW:60s}

finance:
  cache:
    statistics:
      enabled: ${FINANCE_STATISTICS_CACHE_ENABLED:true}
      ttl: ${FINANCE_STATISTICS_CACHE_TTL:60s}
      failure-backoff: ${FINANCE_STATISTICS_CACHE_FAILURE_BACKOFF:30s}

investment:
  cache:
    quote:
      enabled: ${INVESTMENT_QUOTE_CACHE_ENABLED:true}
      ttl: ${INVESTMENT_QUOTE_CACHE_TTL:3s}
      failure-backoff: ${INVESTMENT_QUOTE_CACHE_FAILURE_BACKOFF:30s}
    detail:
      enabled: ${INVESTMENT_DETAIL_CACHE_ENABLED:true}
      fresh-ttl: ${INVESTMENT_DETAIL_CACHE_FRESH_TTL:30s}
      stale-ttl: ${INVESTMENT_DETAIL_CACHE_STALE_TTL:10m}
      failure-backoff: ${INVESTMENT_DETAIL_CACHE_FAILURE_BACKOFF:30s}
  plan:
    zone: ${INVESTMENT_PLAN_ZONE:Asia/Shanghai}
    initial-delay-ms: ${INVESTMENT_PLAN_INITIAL_DELAY_MS:10000}
    scan-delay-ms: ${INVESTMENT_PLAN_SCAN_DELAY_MS:60000}
    batch-limit: ${INVESTMENT_PLAN_BATCH_LIMIT:20}
  history-job:
    scan-delay-ms: ${INVESTMENT_HISTORY_JOB_SCAN_DELAY_MS:1000}
  realtime:
    enabled: ${INVESTMENT_REALTIME_ENABLED:true}
    interval-ms: ${INVESTMENT_REALTIME_INTERVAL_MS:3000}
  fund-sync:
    enabled: ${INVESTMENT_FUND_SYNC_ENABLED:true}
    initial-delay-ms: ${INVESTMENT_FUND_SYNC_INITIAL_DELAY_MS:30000}
    interval-ms: ${INVESTMENT_FUND_SYNC_INTERVAL_MS:7200000}
  sync:
    poll-delay-ms: ${INVESTMENT_SYNC_POLL_DELAY_MS:60000}
