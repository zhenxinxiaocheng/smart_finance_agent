server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/smart_finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      continue-on-error: false
      encoding: UTF-8
  flyway:
    enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  expiration: 86400000

# LangChain4j - DashScope (通义千问)
langchain4j:
  dashscope:
    chat-model:
      model-name: qwen3.6-flash
      temperature: 0.4
      top-p: 0.9
    embedding-model:
      model-name: text-embedding-v4

# 联网搜索配置
search:
  api-key: ${TAVILY_API_KEY:}

bill:
  upload-dir: ${BILL_UPLOAD_DIR:uploads/bills}
  ai:
    endpoint: ${DASHSCOPE_VL_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    multimodal-model: ${DASHSCOPE_VL_MODEL:qwen3.5-omni-plus-2026-03-15}

agent:
  context:
    max-tokens: ${AGENT_CONTEXT_MAX_TOKENS:12000}
    reserved-output-tokens: ${AGENT_CONTEXT_RESERVED_OUTPUT_TOKENS:1500}
    auto-compress-threshold: ${AGENT_CONTEXT_AUTO_COMPRESS_THRESHOLD:0.75}
    summary-model: ${AGENT_CONTEXT_SUMMARY_MODEL:}
    summary-trigger-tokens: ${AGENT_CONTEXT_SUMMARY_TRIGGER_TOKENS:4000}
    summary-keep-messages: ${AGENT_CONTEXT_SUMMARY_KEEP_MESSAGES:20}

analysis-service:
  base-url: ${ANALYSIS_SERVICE_URL:http://127.0.0.1:8090}
  internal-token: ${ANALYSIS_INTERNAL_TOKEN:dev-analysis-token}
  benchmark-connect-timeout: ${ANALYSIS_BENCHMARK_CONNECT_TIMEOUT:10s}
  benchmark-read-timeout: ${ANALYSIS_BENCHMARK_READ_TIMEOUT:90s}

investment:
  plan:
    zone: ${INVESTMENT_PLAN_ZONE:Asia/Shanghai}
    initial-delay-ms: ${INVESTMENT_PLAN_INITIAL_DELAY_MS:10000}
    scan-delay-ms: ${INVESTMENT_PLAN_SCAN_DELAY_MS:60000}
    batch-limit: ${INVESTMENT_PLAN_BATCH_LIMIT:20}
  history-job:
    scan-delay-ms: ${INVESTMENT_HISTORY_JOB_SCAN_DELAY_MS:1000}
  quant:
    initial-delay-ms: ${INVESTMENT_QUANT_INITIAL_DELAY_MS:3000}
    poll-delay-ms: ${INVESTMENT_QUANT_POLL_DELAY_MS:3000}
    job-batch-limit: ${INVESTMENT_QUANT_JOB_BATCH_LIMIT:20}
    monitor:
      initial-delay-ms: ${INVESTMENT_QUANT_MONITOR_INITIAL_DELAY_MS:15000}
      poll-delay-ms: ${INVESTMENT_QUANT_MONITOR_POLL_DELAY_MS:3600000}
      strategy-batch-limit: ${INVESTMENT_QUANT_MONITOR_STRATEGY_BATCH_LIMIT:20}
    paper:
      initial-cash-cny: ${INVESTMENT_QUANT_PAPER_INITIAL_CASH_CNY:1000000}
      minimum-order-cny: ${INVESTMENT_QUANT_PAPER_MINIMUM_ORDER_CNY:100}
      stock-lot-size: ${INVESTMENT_QUANT_PAPER_STOCK_LOT_SIZE:100}
      fund-quantity-scale: ${INVESTMENT_QUANT_PAPER_FUND_QUANTITY_SCALE:4}
      fee-bps: ${INVESTMENT_QUANT_PAPER_FEE_BPS:3}
      slippage-bps: ${INVESTMENT_QUANT_PAPER_SLIPPAGE_BPS:5}
      maximum-volume-participation: ${INVESTMENT_QUANT_PAPER_MAX_VOLUME_PARTICIPATION:0.01}
      limit-lock-minimum-move-ratio: ${INVESTMENT_QUANT_PAPER_LIMIT_LOCK_MIN_MOVE_RATIO:0.04}
      stock-execution-delay-days: ${INVESTMENT_QUANT_PAPER_STOCK_DELAY_DAYS:1}
      fund-execution-delay-days: ${INVESTMENT_QUANT_PAPER_FUND_DELAY_DAYS:1}
      qdii-execution-delay-days: ${INVESTMENT_QUANT_PAPER_QDII_DELAY_DAYS:2}
      initial-delay-ms: ${INVESTMENT_QUANT_PAPER_INITIAL_DELAY_MS:5000}
      poll-delay-ms: ${INVESTMENT_QUANT_PAPER_POLL_DELAY_MS:60000}
      order-batch-limit: ${INVESTMENT_QUANT_PAPER_ORDER_BATCH_LIMIT:50}
      account-order-history-limit: ${INVESTMENT_QUANT_PAPER_ACCOUNT_ORDER_HISTORY_LIMIT:50}
  realtime:
    enabled: ${INVESTMENT_REALTIME_ENABLED:true}
    interval-ms: ${INVESTMENT_REALTIME_INTERVAL_MS:3000}
  fund-sync:
    enabled: ${INVESTMENT_FUND_SYNC_ENABLED:true}
    initial-delay-ms: ${INVESTMENT_FUND_SYNC_INITIAL_DELAY_MS:30000}
    interval-ms: ${INVESTMENT_FUND_SYNC_INTERVAL_MS:7200000}
  sync:
    poll-delay-ms: ${INVESTMENT_SYNC_POLL_DELAY_MS:60000}
